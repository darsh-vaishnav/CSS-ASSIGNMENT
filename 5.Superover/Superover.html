<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Over</title>
</head>
<style>
    * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body.bg {
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% 120%, #1b4d1b 0%, #153818 30%, #0d2136 60%, #040a12 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px;
}

.app {
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.logo {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 36px;
}

.lic {
    width: 34px;
    height: 34px;
    fill: #fff;
}

.ltxt {
    color: #fff;
    font-size: 16px;
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: 1px;
}

.row {
    display: flex;
    gap: 36px;
    justify-content: center;
    width: 100%;
}

.cd {
    flex: 1;
    max-width: 380px;
    border-radius: 20px;
    padding: 36px 20px 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
}

.cd.ind {
    background: #1962bf;
}

.cd.pak {
    background: #37a239;
}

.nm {
    color: #fff;
    font-size: 50px;
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 22px;
}

.balls {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 22px;
}

.b {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #fff;
    color: #000;
    font-size: 18px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
}

.sc {
    color: #fff;
    font-size: 40px;
    font-weight: 700;
    letter-spacing: 2px;
}

.ctrl {
    display: flex;
    gap: 24px;
    margin-top: 36px;
}

.btn {
    width: 64px;
    height: 64px;
    border-radius: 18px;
    border: 4px solid #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
}

.btn.yel {
    background: #f3b236;
}

.btn.red {
    background: #dd3732;
}

.ic {
    width: 28px;
    height: 28px;
    fill: #fff;
}

@media (max-width: 768px) {
    .row {
        flex-direction: column;
        align-items: center;
        gap: 20px;
    }

    .cd {
        width: 100%;
        max-width: 330px;
        padding: 24px 16px 20px;
    }

    .nm {
        font-size: 38px;
        margin-bottom: 16px;
    }

    .balls {
        gap: 6px;
        margin-bottom: 16px;
    }

    .b {
        width: 28px;
        height: 28px;
        font-size: 15px;
    }

    .sc {
        font-size: 32px;
    }

    .btn {
        width: 54px;
        height: 54px;
        border-radius: 14px;
    }

    .ic {
        width: 24px;
        height: 24px;
    }
}
</style>
<body class="bg">
    <div class="app">
        <div class="logo">
            <svg viewBox="0 0 24 24" class="lic">
                <path
                    d="M12 2a2 2 0 1 1-2 2 2 2 0 0 1 2-2zm-2 5.5L7.8 11V16h2v-3.3l1.5-1.5 1.5 5.8h2l-1.8-7-1.8-1.8a2 2 0 0 0-2.2-.7zm-3.5 11a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z" />
            </svg>
            <span class="ltxt">SUPER<br>OVER</span>
        </div>
        <div class="row">
            <div class="cd ind">
                <div class="nm">IND</div>
                <div class="balls">
                    <span class="b">4</span><span class="b">3</span><span class="b">2</span><span
                        class="b">6</span><span class="b">6</span><span class="b">6</span>
                </div>
                <div class="sc">27 / 0</div>
            </div>
            <div class="cd pak">
                <div class="nm">PAK</div>
                <div class="balls">
                    <span class="b">2</span><span class="b">4</span><span class="b">0</span><span
                        class="b">3</span><span class="b">1</span><span class="b">4</span>
                </div>
                <div class="sc">14 / 0</div>
            </div>
        </div>
        <div class="ctrl">
            <button class="btn yel">
                <svg viewBox="0 0 24 24" class="ic">
                    <path
                        d="M19.7 4.3a1 1 0 0 0-1.4 0l-2 2-1-1a1 1 0 0 0-1.4 0l-1.4 1.4a1 1 0 0 0 0 1.4l1 1-8.6 8.6a2 2 0 0 0 0 2.8l.6.6a2 2 0 0 0 2.8 0l8.6-8.6 1 1a1 1 0 0 0 1.4 0l1.4-1.4a1 1 0 0 0 0-1.4l-1-1 2-2a1 1 0 0 0 0-1.4z" />
                </svg>
            </button>
            <button class="btn red">
                <svg viewBox="0 0 24 24" class="ic">
                    <path
                        d="M12 5V1L7 6l5 5V7c3.3 0 6 2.7 6 6s-2.7 6-6 6-6-2.7-6-6H4c0 4.4 3.6 8 8 8s8-3.6 8-8-3.6-8-8-8z" />
                </svg>
            </button>
        </div>
    </div>
</body>

</html>
