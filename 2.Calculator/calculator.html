
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #dcdcdc;
            font-family: Arial, sans-serif;
            padding: 15px;
        }

        .calculator {
            width: 100%;
            max-width: 360px;
            background-color: black;
            padding: 15px;
            border-radius: 25px;
        }

        .display {
            min-height: 110px;
            color: white;
            font-size: clamp(40px, 12vw, 65px);
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            padding: 15px 5px;
            overflow: hidden;
        }

        .middle {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 8px 0;
        }

        .button,
        .orange_button {
            width: 23%;
            aspect-ratio: 1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(18px, 5vw, 30px);
            flex-shrink: 0;
        }

        .button {
            color: black;
            background-color: gray;
        }

        .orange_button {
            color: white;
            background-color: orange;
        }

        .button p,
        .orange_button p,
        .zero p {
            margin: 0;
        }

        .last {
            padding-top: 10px;
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .zero {
            width: 48%;
            border-radius: 50px;
            background-color: gray;
            color: black;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-left: 25px;
            font-size: clamp(18px, 5vw, 30px);
        }

        .last .button,
        .last .orange_button {
            width: 23%;
        }

        @media (max-width: 350px) {
            .calculator {
                padding: 10px;
            }

            .middle {
                gap: 6px 0;
            }

            .display {
                min-height: 90px;
            }

            .zero {
                padding-left: 18px;
            }
        }
    </style>
</head>

<body>
    <div class="calculator">

        <div class="display">7744</div>

        <div class="middle">
            <div class="button"><p>C</p></div>
            <div class="button"><p>+/-</p></div>
            <div class="button"><p>%</p></div>
            <div class="orange_button"><p>/</p></div>

            <div class="button"><p>7</p></div>
            <div class="button"><p>8</p></div>
            <div class="button"><p>9</p></div>
            <div class="orange_button"><p>x</p></div>

            <div class="button"><p>4</p></div>
            <div class="button"><p>5</p></div>
            <div class="button"><p>6</p></div>
            <div class="orange_button"><p>-</p></div>

            <div class="button"><p>1</p></div>
            <div class="button"><p>2</p></div>
            <div class="button"><p>3</p></div>
            <div class="orange_button"><p>+</p></div>
        </div>

        <div class="last">
            <div class="zero"><p>0</p></div>
            <div class="button"><p>,</p></div>
            <div class="orange_button"><p>=</p></div>
        </div>

    </div>
</body>
</html>
